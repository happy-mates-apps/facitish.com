name: build-image
# Builds the one image (Dockerfile) and pushes it to GHCR as <image>:<sha> and <image>:latest.
# Called by deploy.yml when target.yml says push_image.

on:
  workflow_call:
    inputs:
      image: { description: "Image name without tag", required: true, type: string }
    outputs:
      ref: { description: "<image>:<sha>", value: "${{ jobs.build.outputs.ref }}" }

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - id: ref
        run: echo "ref=${{ inputs.image }}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: GAER_VERSION=${{ github.sha }}
          tags: |
            ${{ steps.ref.outputs.ref }}
            ${{ inputs.image }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
