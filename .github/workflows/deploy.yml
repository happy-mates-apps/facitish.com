name: deploy
# Push to main: test, build one image, push it to GitHub Container Registry,
# start Postgres + MinIO on the UpCloud instance, migrate and roll out. If a step fails the rollout stops,
# and the running version stays in place (deploy/deploy.sh only swaps after /health answers).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy-main

permissions:
  contents: read
  packages: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      REGISTRY: ghcr.io
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
      REGISTRY_USER: ${{ github.actor }}
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Validate deployment secrets
        env:
          HOST: ${{ secrets.HOST }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          missing=0
          for name in HOST SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required deployment secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/checkout@v4

      - name: Build and push
        run: |
          echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
          docker build --build-arg GAER_VERSION=${GITHUB_SHA::7} -t $IMAGE .
          docker push $IMAGE

      - name: Prepare SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          echo "SSH=ssh -i $HOME/.ssh/id_deploy -o StrictHostKeyChecking=accept-new deploy@${{ secrets.HOST }}" >> $GITHUB_ENV
          echo "SCP=scp -i $HOME/.ssh/id_deploy -o StrictHostKeyChecking=accept-new" >> $GITHUB_ENV

      - name: Ship deploy scripts and log in to the registry on the instance
        run: |
          $SSH "mkdir -p gaer"
          $SCP deploy/deploy.sh deploy/Caddyfile deploy/infra.compose.yml deploy/backup.sh deploy@${{ secrets.HOST }}:gaer/
          echo "$REGISTRY_TOKEN" | $SSH "docker login $REGISTRY -u $REGISTRY_USER --password-stdin"

      - name: Start Postgres and Garage
        run: |
          $SSH "docker network inspect gaer >/dev/null 2>&1 || docker network create gaer >/dev/null
                cd gaer && docker compose --env-file infra.env -f infra.compose.yml up -d --wait"

      # Migrations run on the instance: Postgres is only reachable on its Docker network.
      - name: Migrate
        run: $SSH "./gaer/deploy.sh migrate $IMAGE"

      - name: Deploy
        run: $SSH "./gaer/deploy.sh release $IMAGE"

      - name: Smoke test
        if: vars.DOMAIN != ''
        run: curl -fsS --retry 5 --retry-delay 3 "https://${{ vars.DOMAIN }}/health"
