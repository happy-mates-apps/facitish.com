name: deploy
# Push to main: test, then deploy to whatever the repository variable DEPLOY_TARGET says (read once in target.yml):
#
#   compose (default)  build one image, stream it to the server over SSH and roll out with docker compose.
#                      deploy/deploy.sh migrates, starts the new version and goes back to the previous one if
#                      /health does not answer.
#   k8s                build to GHCR (build-image.yml), roll out to the namespace (deploy-k8s.yml, deploy/k8s/).
#   none               build to GHCR only.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy-main

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  target:
    uses: ./.github/workflows/target.yml

  build-image:
    needs: [test, target]
    if: needs.target.outputs.push_image == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image: ${{ needs.target.outputs.image }}

  deploy-k8s:
    needs: [target, build-image]
    if: needs.target.outputs.k8s == 'true'
    uses: ./.github/workflows/deploy-k8s.yml
    secrets: inherit
    with:
      image: ${{ needs.build-image.outputs.ref }}
      namespace: ${{ needs.target.outputs.namespace }}
      hostname: ${{ needs.target.outputs.hostname }}

  deploy:
    needs: [test, target]
    if: needs.target.outputs.compose == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.DOMAIN }}
    env:
      IMAGE: gaer:${{ github.sha }}
      REMOTE: deploy@${{ secrets.HOST }}
    steps:
      - name: Validate deployment secrets
        env:
          HOST: ${{ secrets.HOST }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          missing=0
          for name in HOST SSH_KEY SSH_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required deployment secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/checkout@v4

      - name: Build
        run: docker build --build-arg GAER_VERSION=${GITHUB_SHA::7} -t "$IMAGE" .

      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          echo "SSH=ssh -i $HOME/.ssh/id_deploy $REMOTE" >> $GITHUB_ENV
          echo "SCP=scp -i $HOME/.ssh/id_deploy" >> $GITHUB_ENV

      - name: Ship deploy files and image to the server
        run: |
          $SSH "mkdir -p gaer"
          $SCP deploy/deploy.sh deploy/compose.yml deploy/postgres-init.sh deploy/nats.conf "$REMOTE:gaer/"
          docker save "$IMAGE" | gzip -1 | $SSH "gunzip | docker load"

      - name: Release
        run: $SSH "./gaer/deploy.sh release $IMAGE"

      - name: Smoke test
        if: vars.DOMAIN != ''
        run: curl -fsS --retry 5 --retry-delay 3 "https://${{ vars.DOMAIN }}/health"
