name: deploy
# Push to main: test, build one image, push it to GitHub Container Registry and roll out with
# docker compose on the UpCloud server. deploy/deploy.sh migrates, starts the new version and
# goes back to the previous one if /health does not answer.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy-main

permissions:
  contents: read
  packages: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.DOMAIN }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/facitish:${{ github.sha }}
      REMOTE: deploy@${{ secrets.HOST }}
    steps:
      - name: Validate deployment secrets
        env:
          HOST: ${{ secrets.HOST }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          missing=0
          for name in HOST SSH_KEY SSH_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required deployment secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/checkout@v4

      - name: Build and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build --build-arg GAER_VERSION=${GITHUB_SHA::7} \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          echo "SSH=ssh -i $HOME/.ssh/id_deploy $REMOTE" >> $GITHUB_ENV
          echo "SCP=scp -i $HOME/.ssh/id_deploy" >> $GITHUB_ENV

      - name: Ship deploy files and log in to the registry on the server
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $SSH "mkdir -p gaer"
          $SCP deploy/deploy.sh deploy/compose.yml deploy/postgres-init.sh "$REMOTE:gaer/"
          echo "$GH_TOKEN" | $SSH "docker login ghcr.io -u ${{ github.actor }} --password-stdin"

      - name: Release
        run: $SSH "./gaer/deploy.sh release $IMAGE"

      - name: Smoke test
        if: vars.DOMAIN != ''
        run: curl -fsS --retry 5 --retry-delay 3 "https://${{ vars.DOMAIN }}/health"
