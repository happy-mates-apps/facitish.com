# What the Gær Fleet console (Surdej, member-gaer-fleet) creates for every fork, here so it can also be done by hand:
#
#   NAMESPACE=gaer-00001 envsubst '${NAMESPACE}' < deploy/k8s/cluster/namespace.yaml | kubectl apply -f -
#   deploy/k8s/cluster/kubeconfig-for.sh gaer-00001 > kubeconfig-gaer-00001.yaml   # → repo secret KUBE_CONFIG
#
# The fork's workflows only ever get the deployer token below: it can change its own namespace and nothing else.
# Keep this file and member-gaer-fleet/worker/src/k8s/namespace.ts in step.
---
apiVersion: v1
kind: Namespace
metadata:
  name: ${NAMESPACE}
  labels:
    app.kubernetes.io/part-of: gaer
    gaer.toergaer.app/instance: ${NAMESPACE}
---
apiVersion: v1
kind: ResourceQuota
metadata: { name: gaer, namespace: ${NAMESPACE} }
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.memory: 6Gi
    persistentvolumeclaims: "4"
    requests.storage: 40Gi
    pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata: { name: gaer, namespace: ${NAMESPACE} }
spec:
  limits:
    - type: Container
      default: { memory: 512Mi }
      defaultRequest: { cpu: 50m, memory: 128Mi }
---
# Pods in the namespace only take traffic from each other and from the ingress controller (kube-system for
# k3s/traefik, ingress-nginx for nginx). Egress is open: mail, Object Storage and AI are outside the cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: gaer-isolate, namespace: ${NAMESPACE} }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchExpressions:
              - { key: kubernetes.io/metadata.name, operator: In, values: [kube-system, ingress-nginx, traefik] }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: deployer, namespace: ${NAMESPACE} }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: deployer, namespace: ${NAMESPACE} }
rules:
  - apiGroups: [""]
    resources: [secrets, configmaps, services, persistentvolumeclaims, pods, pods/log, events]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: deployer, namespace: ${NAMESPACE} }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: deployer }
subjects:
  - { kind: ServiceAccount, name: deployer, namespace: ${NAMESPACE} }
---
# Long-lived token for the deployer (rotate by deleting this secret and running the console's "Rotate").
apiVersion: v1
kind: Secret
metadata:
  name: deployer-token
  namespace: ${NAMESPACE}
  annotations: { kubernetes.io/service-account.name: deployer }
type: kubernetes.io/service-account-token
